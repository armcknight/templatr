AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  An old domain that redirects to a static site: a CloudFront distribution
  whose viewer-request function answers every request with a permanent
  redirect to the same path on RedirectTo, with an ACM certificate and Route 53
  alias records for the domain and, when WithWww is true, its www. It has no
  bucket. The stack is in us-east-1, where CloudFront needs the certificate.
  The static-site component of armcknight/templatr deploys one for each domain
  in its redirect_from input, with bin/deploy-redirect-stacks, and `templatr
  check` compares each stack's template with this file, as bin/site-template
  renders it with redirect.js.

Parameters:
  DomainName:
    Type: String
    Description: The domain that redirects, such as armcknight.com.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone that has DomainName, or a parent of it.
  RedirectTo:
    Type: String
    Description: The site's domain that every request is redirected to, such as mcknight.io.
  WithWww:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Whether www.<DomainName> redirects too. Only for an apex domain.

Conditions:
  HasWww: !Equals [!Ref WithWww, 'true']

# Fixed IDs that AWS publishes. They are the same in every account and region.
Mappings:
  AwsIds:
    CloudFront:
      # The hosted zone ID for every alias record that points at CloudFront.
      AliasHostedZoneId: Z2FDTNDATAQYW2
    CachePolicy:
      # Managed-CachingDisabled: the function answers before the cache, so
      # there is nothing to keep.
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
    ResponseHeadersPolicy:
      # Managed-SecurityHeadersPolicy, so that the redirect carries HSTS too.
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - HasWww
        - [!Sub 'www.${DomainName}']
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasWww
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub 'www.${DomainName}'
            HostedZoneId: !Ref HostedZoneId
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId

  # Its code is redirect.js, next to this file; bin/site-template puts it in
  # place of the marker line below.
  RedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub 'Redirects every request to ${RedirectTo}.'
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        @FUNCTION redirect.js@

  # The function answers every request, so the origin is never reached. It is
  # the site itself, which is the one address that stays right.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${DomainName} redirects to ${RedirectTo}'
        Aliases: !If
          - HasWww
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !Ref RedirectTo
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: !FindInMap [AwsIds, CachePolicy, CachingDisabled]
          ResponseHeadersPolicyId: !FindInMap [AwsIds, ResponseHeadersPolicy, SecurityHeaders]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  RecordIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [AwsIds, CloudFront, AliasHostedZoneId]

  RecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [AwsIds, CloudFront, AliasHostedZoneId]

  RecordWwwIPv4:
    Type: AWS::Route53::RecordSet
    Condition: HasWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [AwsIds, CloudFront, AliasHostedZoneId]

  RecordWwwIPv6:
    Type: AWS::Route53::RecordSet
    Condition: HasWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [AwsIds, CloudFront, AliasHostedZoneId]

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  RedirectsTo:
    Value: !Sub 'https://${RedirectTo}'
