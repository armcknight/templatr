name = "supabase"
description = "A Postgres database on Supabase for a Vapor server on Fly.io, with local and test databases, the Supabase root CA in the server's image, a local and remote parity check, and migrations that run before each deploy or when the server starts."

# The component's files are in supabase/, the Supabase CLI's own directory: its
# config.toml and migrations, and the component's README.md, component.mk and
# .gitignore. The detect and infer rules read files there, and the steps run
# there. The server's files are in vapor-fly's directory, server/, which the
# rules with root = true read, and the steps that check the Dockerfile, fly.toml
# and the CA certificate read at ../server/.
directory = "supabase"
blurb = "The server's Postgres database, on Supabase. `make local-db init` makes the local database, and `make local-db test-start` starts the isolated test database."

# A Supabase CLI project, or a supabase/component.mk from this scaffold. A
# fluent project, such as mtg, has neither before it has the component, so it is
# also detected from the root: a server that uses Postgres through Fluent, or a
# .envrc.example with a Supabase host.
[detect]
any = [
  { glob = "config.toml" },
  { glob = "component.mk", contains = "supabase\\.mk" },
  { glob = "server/Package.swift", contains = "fluent-postgres-driver", root = true },
  { glob = ".envrc.example", contains = "supabase\\.co", root = true },
]

# The reference ID of the Supabase project: the subdomain of its API URL, and
# part of its database hosts. The CLI's config.toml has a project_id, but that
# is only the local stack's name unless it is a reference ID, so only a value
# of that form is read. The root's .envrc.example has it in DATABASE_URL: the
# pooler's user is postgres.<project_ref>, and the direct host is
# db.<project_ref>.supabase.co.
[[inputs]]
name = "project_ref"
description = "The Supabase project's reference ID, as in https://<project_ref>.supabase.co."
example = "abcdefghijklmnopqrst"
infer = [
  { from = "regex", glob = ".temp/project-ref", pattern = "^([a-z0-9]{20})\\b" },
  { from = "regex", glob = "config.toml", pattern = "(?m)^\\s*project_id\\s*=\\s*\"([a-z0-9]{20})\"" },
  { from = "regex", glob = ".envrc.example", pattern = "(?:postgres\\.|db\\.|https://)([a-z0-9]{20})\\b", root = true },
]

# cli: SQL in supabase/migrations, which `supabase db push` applies before each
# deploy. fluent: Fluent migrations in the server, which it applies when it
# starts, as mtg does.
[[inputs]]
name = "migration_style"
description = "How the schema changes: cli, SQL migrations in supabase/migrations that `supabase db push` applies before each deploy; or fluent, Fluent migrations that the server applies when it starts."
example = "cli"
infer = [
  { from = "glob", glob = "config.toml", exists = true, map = { "true" = "cli" } },
  { from = "regex", glob = "component.mk", pattern = "(?m)^SUPABASE_MIGRATION_STYLE\\s*=\\s*(cli|fluent)\\s*$" },
]

[[inputs]]
name = "product"
description = "The executable product in server/Package.swift that runs the server. In the fluent style, `make local-db migrate` runs it with `migrate`."
example = "mtg-server"
infer = [
  { from = "regex", glob = "component.mk", pattern = "(?m)^SUPABASE_PRODUCT\\s*=\\s*(\\S+)" },
  { from = "regex", glob = "server/Package.swift", pattern = "\\.executable\\(\\s*name:\\s*\"([^\"]+)\"", root = true },
]

[[inputs]]
name = "fly_app"
description = "The Fly app that runs the server and has DATABASE_URL as a secret: the vapor-fly component's fly_app."
example = "mtg-server"
infer = [{ from = "toml", file = "server/fly.toml", key = "app", root = true }]

# The Supabase CLI's local stack has one database, postgres.
[[inputs]]
name = "database_name"
description = "The name of the local development database. The Supabase CLI's local stack uses postgres."
example = "mtg_collection"
infer = [
  { from = "glob", glob = "config.toml", exists = true, map = { "true" = "postgres" } },
  { from = "regex", glob = "component.mk", pattern = "(?m)^SUPABASE_DB_NAME\\s*=\\s*([A-Za-z0-9_]+)" },
]

[[inputs]]
name = "pg_version"
description = "The major version of Postgres: the Homebrew postgresql@<version> whose tools the local and test databases use. Keep it the same as the Supabase project's."
example = "17"
default = "17"
infer = [
  { from = "toml", file = "config.toml", key = "db.major_version" },
  { from = "regex", glob = "component.mk", pattern = "(?m)^SUPABASE_PG_VERSION\\s*=\\s*([0-9]+)" },
]

# The CA certificate is in server/, the Docker image's build context. Its path
# is the one that server/Dockerfile copies into the image; a glob would find
# the file, but its path from the root, not from server/.
[[inputs]]
name = "ca_cert_path"
description = "Where the server keeps Supabase's root CA certificate, which the Docker image copies in, relative to server/, the image's build context."
example = "deploy/supabase-root-2021-ca.crt"
default = "deploy/supabase-root-2021-ca.crt"
infer = [
  { from = "regex", glob = "server/Dockerfile", pattern = "(?m)^\\s*COPY\\s+(?:--\\S+\\s+)*(\\S*supabase-root-\\S*\\.crt)\\s", root = true },
]

[[inputs]]
name = "ca_cert_env"
description = "The environment variable, set in server/fly.toml's [env], that has the path of the CA certificate in the image. The server verifies the database's TLS certificate against it."
example = "MTG_DB_CA_CERT"
default = "DATABASE_CA_CERT"
infer = [
  { from = "regex", glob = "server/fly.toml", pattern = "(?m)^\\[env\\][^\\[]*?^\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*[\"'][^\"'\\n]*\\.crt[\"']", root = true },
]

# DATABASE_URL is a Fly secret, set by the owner with `fly secrets import`.
# It stays in the owner's Keychain for that, and for `make server
# status-diff`, which reads the remote database; it is never a GitHub secret.
[[secrets]]
name = "DATABASE_URL"
description = "The Supabase database's pooled connection string (session mode, port 5432) with ?sslmode=require. The server reads it as a Fly secret."
source = "keychain:templatr.supabase.{{inputs.project_ref}}.database-url"
scope = "local"
human = { text = "Sign in to https://supabase.com/dashboard (with two-factor authentication) and make a project for {{inputs.fly_app}}, in the region nearest the Fly app's primary_region in fly.toml. Store its database password in the Keychain item templatr.supabase.{{inputs.project_ref}}.db-password. From Connect, copy the session pooler's connection string (port 5432), put the password in it, add ?sslmode=require, and store it in the Keychain item templatr.supabase.{{inputs.project_ref}}.database-url. Project settings that are not in supabase/config.toml, such as Auth providers, are the project's own Needs human steps.", twoFactor = true }

[[secrets]]
name = "SUPABASE_DB_PASSWORD"
description = "The Supabase database's password, for `supabase db push` in the deploy workflow. Only the cli style uses it."
source = "keychain:templatr.supabase.{{inputs.project_ref}}.db-password"
scope = "repo"

[[secrets]]
name = "SUPABASE_ACCESS_TOKEN"
description = "A Supabase personal access token, for `supabase link` and `supabase db push` in the deploy workflow. Only the cli style uses it."
source = "keychain:templatr.supabase.access-token"
scope = "team"
human = { text = "In https://supabase.com/dashboard/account/tokens (with two-factor authentication), generate a token named templatr, and store it in the Keychain item templatr.supabase.access-token. It is shown only one time.", twoFactor = true }
rotateEvery = "1y"

[[steps]]
id = "tools"
description = "The Supabase CLI, the Postgres tools at pg_version, OpenSSL 3 and jq are installed."
check = "command -v supabase >/dev/null && command -v jq >/dev/null && test -x \"$(brew --prefix)/opt/postgresql@\"{{inputs.pg_version}}\"/bin/psql\" && test -x \"$(brew --prefix)/opt/openssl@3/bin/openssl\""
fix = "brew install supabase/tap/supabase postgresql@{{inputs.pg_version}} openssl@3 jq"

[[steps]]
id = "supabase-project"
description = "The Supabase project exists, and the Supabase CLI can see it."
check = "{{templates}}/components/supabase/bin/check-supabase-project {{inputs.project_ref}}"
fix = { human = { text = "Make the Supabase project as the DATABASE_URL secret says, then run `supabase login` on this Mac, so that the CLI can see the project {{inputs.project_ref}}." } }

[[steps]]
id = "gitignore"
description = "Git ignores the root's .envrc, and in supabase/, the test database's directory, the parity snapshots, the logs and the Supabase CLI's local state."
check = "for p in ../.envrc .test-pgdata/ status/local.json .temp/x .branches/x supabase-db-init.log; do git check-ignore -q --no-index \"$p\" || exit 1; done"
fix = "{ git check-ignore -q --no-index ../.envrc || printf '%s\\n' .envrc >> ../.gitignore; } && for p in .test-pgdata/ status/ .temp/ .branches/ '*.log'; do grep -qxF \"$p\" .gitignore 2>/dev/null || printf '%s\\n' \"$p\" >> .gitignore; done"

[[steps]]
id = "envrc-example"
description = "The root's .envrc.example names DATABASE_URL, which direnv exports from the real, ignored .envrc. The fix adds it to the file that is there, or makes the file, so that it works with any other component's lines."
check = "grep -qs 'DATABASE_URL' ../.envrc.example"
fix = '''grep -qs DATABASE_URL ../.envrc.example || { if [ -s ../.envrc.example ]; then printf '\n' >> ../.envrc.example; fi; printf '%s\n' '# The Supabase database'"'"'s pooled connection string (session mode, port 5432),' '# with ?sslmode=require. `make server status-diff` and `make server refresh-ca`' '# read it; the server reads it as a Fly secret. Copy this file to .envrc, which' '# git ignores, and fill in the value there; never commit it.' "# Keychain: templatr.supabase."{{inputs.project_ref}}".database-url" "export DATABASE_URL='postgres://postgres."{{inputs.project_ref}}":<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require'" >> ../.envrc.example; }'''

[[steps]]
id = "make-fragment"
description = "supabase/component.mk includes make/supabase.mk, with the local-db commands, and adds the local-db namespace."
check = "grep -qs 'supabase\\.mk' component.mk && grep -qs 'NAMESPACES *+= *local-db' component.mk"
fix = { human = { text = "Copy supabase/component.mk from the supabase scaffold, with its SUPABASE_* values, the include and the local-db-* and server-* targets, and move any local database targets in the root Makefile to it, pointed at the supabase-* targets." } }

[[steps]]
id = "ca-certificate"
description = "The server has Supabase's root CA certificate."
check = "openssl x509 -in ../server/{{inputs.ca_cert_path}} -noout"
fix = { human = { text = "With DATABASE_URL in the environment, run `make server refresh-ca`. It downloads Supabase's root CA to server/{{inputs.ca_cert_path}} and verifies the database's TLS certificate against it. Commit the certificate: it is public." } }

[[steps]]
id = "ca-in-image"
description = "The server's Docker image has the CA certificate, and server/fly.toml's [env] gives the server its path."
check = "grep -qsF -- {{inputs.ca_cert_path}} ../server/Dockerfile && grep -Eqs \"^[[:space:]]*\"{{inputs.ca_cert_env}}\"[[:space:]]*=\" ../server/fly.toml"
fix = { human = { text = "In server/Dockerfile's runtime stage, add `COPY {{inputs.ca_cert_path}} /app/supabase-root-ca.crt`. In server/fly.toml's [env], set {{inputs.ca_cert_env}} = \"/app/supabase-root-ca.crt\". The server must read {{inputs.ca_cert_env}} and, when it is set, require TLS and verify the database's certificate against that file, as mtg's PostgresConnection.swift does; see the supabase component's CLAUDE.md." } }

[[steps]]
id = "fly-secret"
description = "The Fly app has DATABASE_URL as a secret."
check = "{{templates}}/components/vapor-fly/bin/check-fly-secrets {{inputs.fly_app}} DATABASE_URL"
fix = { human = { text = "Set DATABASE_URL on {{inputs.fly_app}} from the Keychain item templatr.supabase.{{inputs.project_ref}}.database-url, so that the value is in no shell history or log: `printf 'DATABASE_URL=%s\\n' \"$(security find-generic-password -s templatr.supabase.{{inputs.project_ref}}.database-url -w)\" | fly secrets import --stage --app {{inputs.fly_app}}`. --stage keeps the machines as they are until the next deploy." } }

[[steps]]
id = "deploy-migrations"
description = "In the cli style, the deploy workflow applies the migrations with `supabase db push` before it deploys, and a failed migration stops the deploy. The fluent style needs nothing here."
check = "[ {{inputs.migration_style}} != cli ] || { grep -qs 'supabase-migrate\\.yml' ../.github/workflows/vapor-fly-deploy.yml && grep -Eqs 'needs:.*migrate' ../.github/workflows/vapor-fly-deploy.yml; }"
fix = { human = { text = "Copy .github/workflows/supabase-migrate.yml from the supabase scaffold. In .github/workflows/vapor-fly-deploy.yml, add a job before the deploy job: `migrate:` with `uses: ./.github/workflows/supabase-migrate.yml`, `with: { project-ref: {{inputs.project_ref}}, deploy-on: <the deploy job's deploy-on> }` and `secrets: { SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}, SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }} }`; then add `needs: migrate` to the deploy job. Keep the two deploy-on values the same." } }

[[shared]]
kind = "make"
path = "make/supabase.mk"
version = "v1"
description = "The supabase-db-init, supabase-db-reset, supabase-db-migrate, supabase-db-test-start, supabase-db-test-stop, supabase-db-status, supabase-status-diff and supabase-refresh-ca targets."

[[shared]]
kind = "script"
path = "components/supabase/bin/check-supabase-project"
version = "v1"
description = "Checks that the Supabase CLI can see the project."

[[shared]]
kind = "script"
path = "components/supabase/bin/supabase-ca"
version = "v1"
description = "Downloads the database's root CA certificate and verifies the database's TLS certificate against it."

[[shared]]
kind = "script"
path = "components/supabase/bin/db-snapshot"
version = "v1"
description = "Writes a database's tables, columns, row counts and applied migrations as JSON."

[[shared]]
kind = "script"
path = "components/supabase/bin/db-snapshot-diff"
version = "v1"
description = "Compares two snapshots, and exits 1 when the databases differ."

[[shared]]
kind = "script"
path = "components/vapor-fly/bin/check-fly-secrets"
version = "v1"
description = "Checks that the Fly app has DATABASE_URL, by name."

