name = "apple-app"
description = "An app for iOS (with an optional embedded watch app), tvOS, macOS or more than one of them, from one Xcode project, tested on each pull request, with staging builds on demand, and uploaded to TestFlight by hand with `make apple <platform> deploy-beta`."

# The app's files, the Xcode project, the Gemfile and fastlane/ included, are
# in apple/. It is apple/ and not ios/, because the one Xcode project there
# builds the app for each platform in the platforms input. The detect and infer
# rules read files there, and the steps run there.
directory = "apple"
blurb = "The app, {{inputs.app_name}}, for {{inputs.platforms}}. `make apple test` runs its tests on each platform and `make apple <platform> test` on one, `/build-staging` on a pull request posts an install link, and the owner uploads it to TestFlight with `make apple <platform> deploy-beta`."

# An Xcode project, an XcodeGen spec or a Tuist manifest with an application
# target. The product type also matches a watch app, which is always embedded in
# an iOS app here, so it does not cause a false detection.
[detect]
any = [
  { glob = "**/*.xcodeproj/project.pbxproj", contains = "com\\.apple\\.product-type\\.application" },
  { glob = "project.yml", contains = "type:\\s*application\\b" },
  { glob = "Project.swift", contains = "product:\\s*\\.app\\b" },
]

[[inputs]]
name = "app_name"
description = "The app's product name in the Release configuration, as App Store Connect names the app."
example = "Babysittr"
infer = [{ from = "build-setting", key = "PRODUCT_NAME" }]

[[inputs]]
name = "scheme"
description = "The shared Xcode scheme that builds and tests the app."
example = "Babysittr"
# The scheme's file name is its name. A scheme that builds an app comes first,
# so that a framework's or a test's scheme is not chosen.
infer = [
  { from = "glob", glob = "**/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme", contains = "BuildableName = \"[^\"]+\\.app\"", stem = true },
  { from = "glob", glob = "**/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme", stem = true },
]

[[inputs]]
name = "project"
description = "The Xcode project, relative to apple/. Leave empty when `workspace` is set."
example = "Babysittr.xcodeproj"
infer = [{ from = "glob", glob = "*.xcodeproj" }]

[[inputs]]
name = "workspace"
description = "The Xcode workspace, relative to apple/, when the app builds from one."
example = "Trgnmtry.xcworkspace"
default = ""
infer = [{ from = "glob", glob = "*.xcworkspace" }]

[[inputs]]
name = "xcconfig"
description = "The xcconfig, relative to apple/, that sets MARKETING_VERSION and CURRENT_PROJECT_VERSION for every target."
example = "config/Babysittr.xcconfig"
infer = [{ from = "glob", glob = "**/*.xcconfig", contains = "MARKETING_VERSION[ \\t]*=" }]

[[inputs]]
name = "xcodegen"
description = "Whether the Xcode project is generated from project.yml with XcodeGen before each build."
example = "true"
infer = [{ from = "glob", glob = "project.yml", exists = true }]

# The one Xcode project in apple/ can build the app for more than one platform.
# Each platform gets its own make commands, such as `make apple ios test` and
# `make apple mac deploy-beta`. A simulator's platform is the same platform.
[[inputs]]
name = "platforms"
description = "The platforms the app builds for, as fastlane names them, separated by spaces: ios, tvos and mac, such as `ios mac`. An iOS app with an embedded watch app is ios."
example = "ios mac"
infer = [{ from = "build-setting", key = "SUPPORTED_PLATFORMS", separator = " ", map = { iphoneos = "ios", iphonesimulator = "ios", appletvos = "tvos", appletvsimulator = "tvos", macosx = "mac" } }]

[[inputs]]
name = "bundle_id"
description = "The app's bundle identifier in App Store Connect."
example = "io.mcknight.babysittr"
infer = [
  { from = "fastlane-config", file = "fastlane/Appfile", key = "app_identifier" },
  { from = "build-setting", key = "PRODUCT_BUNDLE_IDENTIFIER" },
]

[[inputs]]
name = "adhoc_bundle_id"
description = "The bundle identifier of the app's ad-hoc variant, which staging builds use."
example = "io.mcknight.babysittr.adhoc"
infer = [
  { from = "regex", glob = "fastlane/Matchfile", pattern = "[\"']([^\"']+\\.adhoc)[\"']" },
  { from = "regex", glob = "fastlane/Fastfile", pattern = "type:\\s*\"adhoc\",\\s*app_identifier:\\s*\"([^\"]+)\"" },
]

[[inputs]]
name = "stage_xcargs"
description = "Extra xcodebuild arguments for a staging build, such as a build setting that switches the app to its ad-hoc bundle identifier. Empty for none."
example = "BABYSITTR_VARIANT=AdHoc"
default = ""
infer = [{ from = "regex", glob = "fastlane/Fastfile", pattern = "xcargs:\\s*\"([A-Z][A-Z0-9_]*_VARIANT=AdHoc)\"" }]

[[inputs]]
name = "arkana_keys"
description = "The Arkana keys that CI writes to .env before it builds, separated by spaces. Each value comes from the repository secret of the same name."
example = "SentryDSN FeedbackEmail"
infer = [{ from = "yaml", file = ".arkana.yml", key = "global_secrets", separator = " " }]

[[inputs]]
name = "app_identifiers"
description = "Every bundle identifier that needs an App Store profile, comma separated: the app, its extensions and its watch app."
example = "io.mcknight.babysittr,io.mcknight.babysittr.watchkitapp"
infer = [{ from = "fastlane-config", file = "fastlane/Matchfile", key = "app_identifier" }]

[[inputs]]
name = "team_id"
description = "The Apple Developer team ID."
example = "29274SF4VL"
infer = [
  { from = "fastlane-config", file = "fastlane/Appfile", key = "team_id" },
  { from = "build-setting", key = "DEVELOPMENT_TEAM" },
]

[[inputs]]
name = "match_git_url"
description = "The SSH URL of the fastlane match repository that holds the certificates and profiles."
example = "git@github.com:armcknight/fastlane-match.git"
infer = [{ from = "fastlane-config", file = "fastlane/Matchfile", key = "git_url" }]

[[inputs]]
name = "test_device"
description = "The simulator the tests run on. Ignored for mac."
example = "iPhone 16 Pro"
default = "iPhone 16 Pro"

[[inputs]]
name = "tester_group"
description = "The internal TestFlight group that gets each build."
example = "Internal"
default = "Internal"

# The App Store Connect API key stays in the owner's Keychain. `make apple
# <platform> deploy-beta` uses it when it is in the environment, and the app-record and
# tester-group checks need it. It is never a GitHub secret.
[[secrets]]
name = "ASC_KEY_ID"
description = "The key ID of the App Store Connect API key."
source = "keychain:superlinear.asc.key-id"
scope = "local"
human = { text = "In App Store Connect, Users and Access, Integrations, App Store Connect API, Team Keys: generate a key with the App Manager role. Store its key ID, its issuer ID and the downloaded .p8 file, base64 encoded, in the Keychain items superlinear.asc.key-id, superlinear.asc.issuer-id and superlinear.asc.key-p8-base64. The .p8 file downloads only one time.", twoFactor = true }

[[secrets]]
name = "ASC_ISSUER_ID"
description = "The issuer ID of the App Store Connect API key."
source = "keychain:superlinear.asc.issuer-id"
scope = "local"

[[secrets]]
name = "ASC_KEY_P8_BASE64"
description = "The App Store Connect API key's .p8 file, base64 encoded. The key has the App Manager role."
source = "keychain:superlinear.asc.key-p8-base64"
scope = "local"
rotateEvery = "1y"

[[secrets]]
name = "MATCH_PASSWORD"
description = "The passphrase that decrypts the fastlane match repository."
source = "keychain:superlinear.match.password"
scope = "team"

[[secrets]]
name = "MATCH_DEPLOY_KEY"
description = "The private half of a read-only deploy key on the fastlane match repository."
source = "generate:ssh-key"
scope = "team"
human = { text = "Add the public half of the generated key (the Keychain item superlinear.match-deploy-key.pub) to the fastlane match repository as a read-only deploy key." }
rotateEvery = "1y"

[[steps]]
id = "gemfile"
description = "The Gemfile has fastlane."
check = "grep -Eq '^[[:space:]]*gem[[:space:]]+.fastlane.' Gemfile"
fix = "bundle add fastlane"

[[steps]]
id = "shared-lanes"
description = "fastlane/Fastfile imports the shared lanes at the pinned tag and does not define its own test, stage or beta lanes."
check = "{{templates}}/components/apple-app/bin/check-shared-lanes {{templates.tag}}"
fix = { human = { text = "Replace the test, stage and deploy lanes in fastlane/Fastfile with the shared ones: set the APPLE_APP_* values and call import_from_git as the apple-app scaffold's Fastfile does, then delete the local test, stage and beta lanes. The shared beta lane does what a local deploy lane did, so delete that too, and point `make apple deploy-beta` and `make apple <platform> deploy-beta` at it. Lanes the shared Fastfile does not have, such as build_dev, stay." } }

[[steps]]
id = "workflows"
description = "The repository calls armcknight/workflows' ios-ci.yml for pull requests and staging builds."
check = "grep -qs 'armcknight/workflows/.github/workflows/ios-ci.yml@' ../.github/workflows/*.yml"
fix = { human = { text = "Copy apple-app-ci.yml, apple-app-staging-build.yml, apple-app-refresh-staging-link.yml and apple-app-stage-cleanup.yml in .github/workflows/ from the apple-app scaffold, and remove the workflows they replace, including any that upload to TestFlight." } }

[[steps]]
id = "make-fragment"
description = "apple/component.mk includes make/apple-app.mk, with the app's platforms and commands, and adds the apple namespace."
check = "grep -qs 'apple-app\\.mk' component.mk && grep -qs 'NAMESPACES *+= *apple' component.mk && grep -qs 'APPLE_APP_PLATFORMS *=' component.mk"
fix = { human = { text = "Copy apple/component.mk from the apple-app scaffold, with its APPLE_APP_* values (APPLE_APP_PLATFORMS is {{inputs.platforms}}), the include and the apple-* targets, and move any test, stage, deploy-beta or version targets in the root Makefile to it, pointed at the apple-app-* targets." } }

[[steps]]
id = "staging-variables"
description = "The repository has the variables that staging builds use: AWS_ROLE_ARN, AWS_REGION and S3_BUCKET."
check = "names=\"$(gh variable list --json name --jq '.[].name')\" && for v in AWS_ROLE_ARN AWS_REGION S3_BUCKET; do printf '%s\\n' \"$names\" | grep -qx \"$v\" || exit 1; done"
fix = { human = { text = "In the repository's settings, Secrets and variables, Actions, Variables: set AWS_ROLE_ARN to the IAM role that GitHub's OIDC provider assumes for staging builds, AWS_REGION to the staging bucket's region, and S3_BUCKET to the staging bucket, as the other apps that use armcknight/workflows have them. See https://github.com/armcknight/workflows#readme." } }

[[steps]]
id = "match-access"
description = "The fastlane match repository can be read."
check = "git ls-remote {{inputs.match_git_url}} HEAD >/dev/null"
fix = { human = { text = "Give this machine read access to {{inputs.match_git_url}}, and add the MATCH_DEPLOY_KEY public key to it as a read-only deploy key." } }

[[steps]]
id = "app-record"
description = "The app has a record in App Store Connect."
scope = "app"
check = "bundle exec ruby {{templates}}/components/apple-app/bin/check-app-store-connect {{inputs.bundle_id}}"
fix = { human = { text = "In App Store Connect, Apps: make a new app for the bundle ID {{inputs.bundle_id}} (register the bundle ID in the developer portal first if it is not listed), named {{inputs.app_name}}." } }

[[steps]]
id = "tester-group"
description = "The app has the internal TestFlight group that gets each build."
scope = "app"
check = "bundle exec ruby {{templates}}/components/apple-app/bin/check-app-store-connect {{inputs.bundle_id}} {{inputs.tester_group}}"
fix = { human = { text = "In App Store Connect, {{inputs.app_name}}, TestFlight: add an internal group named {{inputs.tester_group}}, turn on automatic distribution, and add the testers." } }

[[shared]]
kind = "fastlane"
path = "fastlane/Fastfile"
version = "v1"
description = "The test and beta lanes for ios, tvos and mac, and the stage lane for ios."

[[shared]]
kind = "workflow"
repo = "armcknight/workflows"
path = ".github/workflows/ios-ci.yml"
version = "4"
description = "Runs the test lane on each pull request, and on a /build-staging comment the stage lane, with an install link."

[[shared]]
kind = "workflow"
repo = "armcknight/workflows"
path = ".github/workflows/ota-refresh.yml"
version = "4"
description = "Signs a staging build's install link again on a /refresh-staging comment, and asks for a new build when the old one is gone."

[[shared]]
kind = "workflow"
repo = "armcknight/workflows"
path = ".github/workflows/ota-cleanup.yml"
version = "4"
description = "Deletes a pull request's staging builds when it closes."

[[shared]]
kind = "make"
path = "make/apple-app.mk"
version = "v1"
description = "The apple-app-test and apple-app-deploy-beta targets for every platform, apple-app-<platform>-test and apple-app-<platform>-deploy-beta for each, apple-app-ios-stage, and apple-app-patch, apple-app-minor and apple-app-major."

[[shared]]
kind = "brewfile"
path = "components/apple-app/scaffold/apple/Brewfile"
version = "v1"
description = "The tools the lanes use."

[[shared]]
kind = "script"
path = "components/apple-app/bin/check-app-store-connect"
version = "v1"
description = "Checks the app record and its tester group in App Store Connect."

[[shared]]
kind = "script"
path = "components/apple-app/bin/list-match-certificates"
version = "v1"
description = "Lists the certificates and profiles in the fastlane match repository, with their expiry dates."

[[shared]]
kind = "script"
path = "components/apple-app/bin/check-shared-lanes"
version = "v1"
description = "Checks that fastlane/Fastfile uses the shared lanes."

