name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # superlinear's bootstrap uses the ComponentManifest library on macOS; the
    # Linux build here keeps the package portable.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test the validator
        run: swift test

      - name: Validate the manifests
        run: swift run validate-components

  # The linear-workspace component's script is JavaScript for Automation, and
  # its tests run it against a fake Linear API: they run only on macOS, as
  # superlinear does. The apple-app component's match-certificates package
  # reads certificates with the Security framework, so it builds only on macOS.
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Test the match-certificates package
        run: swift test --package-path components/apple-app/match-certificates

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
