name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # superlinear's bootstrap uses the ComponentManifest library on macOS; the
    # Linux build here keeps the package portable.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test the validator
        run: swift test

      - name: Validate the manifests
        run: swift run validate-components

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
