name: release

# Two families of tags, two releases.
#
# The templates' releases, `v1.1.0`, with the shared github-release.yml.
# `make templates-deploy` migrates components/CHANGELOG.md, tags and pushes
# from a workstation. This picks the tag up and does the things that must not
# depend on which machine tagged: publish the GitHub release from the
# changelog section, move the major alias, such as `v1`, that projects pin,
# and ask mcknight.io to refresh its projects page.
#
# The command's releases, `2.1.0`, with the shared swiftpm-cask-release.yml.
# `make deploy` migrates CHANGELOG.md, tags, pushes and makes the GitHub
# release from a workstation. This builds the binary, signs and notarizes it
# with the Developer ID certificate from the fastlane match repository, as
# tools, workr and superlinear are, ships it to the templatr cask in
# armcknight/homebrew-tools, and bumps the cask. It needs the MATCH_PASSWORD,
# MATCH_DEPLOY_KEY, NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER_ID secrets,
# from the owner's Keychain. The cask's templatr has no checkout of this
# repository, so it keeps a clone of its own in
# ~/Library/Application Support/templatr/templates, fetched on each run.

on:
  push:
    tags:
    # prepare-release names the templates' tag `v` and the version in
    # components/VERSION, and the command's the version in
    # Sources/TemplatrCLI/Version.swift alone. A release candidate carries a
    # `-RC<n>` suffix. The alias `v<major>` has no dot, so moving it does not
    # start this workflow.
    - 'v[0-9]+.[0-9]+.[0-9]+'
    - 'v[0-9]+.[0-9]+.[0-9]+-*'
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  templates:
    if: startsWith(github.ref_name, 'v')
    # The major-alias input and the notify step are on armcknight/workflows'
    # main but in no release yet: 4.2.0, the newest, has neither. Pin @4 once a
    # release has them.
    uses: armcknight/workflows/.github/workflows/github-release.yml@b697717006f9e4f53626bf153bdc16b5f7450a84
    with:
      changelog: components/CHANGELOG.md
      major-alias: true
    secrets:
      # TEM-56 sets this secret. Without it the release does not notify
      # mcknight.io.
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}

  command:
    if: ${{ !startsWith(github.ref_name, 'v') }}
    uses: armcknight/workflows/.github/workflows/swiftpm-cask-release.yml@4
    # TAP_RELEASE_TOKEN, a fine-grained token with Contents read and write on
    # armcknight/homebrew-tools, the MATCH_* and NOTARY_* secrets for signing,
    # and SITE_DISPATCH_TOKEN when it is set.
    secrets: inherit
    with:
      cask-name: templatr
      binaries: templatr
      version-file: Sources/TemplatrCLI/Version.swift
      version-regex: '.*static let version = "([^"]+)".*'
      sign: true
      match-git-url: git@github.com:armcknight/fastlane-match.git
      team-id: 29274SF4VL
      bundle-id: io.mcknight.templatr
