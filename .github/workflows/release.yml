name: release

# The templates' releases, with the shared github-release.yml.
#
# `make templates-deploy` migrates components/CHANGELOG.md, tags and pushes from
# a workstation. This picks the tag up and does the things that must not depend
# on which machine tagged: publish the GitHub release from the changelog
# section, move the major alias, such as `v1`, that projects pin, and ask
# mcknight.io to refresh its projects page.
#
# The templatr command's tags, such as `0.1.0`, have no `v` prefix and do not
# start this workflow yet. TEM-38 adds their cask release.

on:
  push:
    tags:
    # prepare-release names the tag `v` and the version in components/VERSION.
    # A release candidate carries a `-RC<n>` suffix. The alias `v<major>` has
    # no dot, so moving it does not start this workflow.
    - 'v[0-9]+.[0-9]+.[0-9]+'
    - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    # The major-alias input and the notify step are on armcknight/workflows'
    # main but in no release yet: 4.2.0, the newest, has neither. Pin @4 once a
    # release has them.
    uses: armcknight/workflows/.github/workflows/github-release.yml@b697717006f9e4f53626bf153bdc16b5f7450a84
    with:
      changelog: components/CHANGELOG.md
      major-alias: true
    secrets:
      # TEM-56 sets this secret. Without it the release does not notify
      # mcknight.io.
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
